name: Install DFW After Dark v2
on:
  push:
    paths:
      - '.dfw-v2-payload/**'
      - '.github/workflows/install-dfw-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Brotli decoder
        run: python -m pip install --disable-pip-version-check brotli
      - name: Verify and unpack exact v2 source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, brotli, hashlib
          parts = [Path(f'.dfw-v2-payload/part-{i:02d}.txt').read_text().strip() for i in range(1,7)]
          payload = ''.join(parts)
          assert hashlib.sha256(payload.encode()).hexdigest() == '3aa11263a95af7ec5f82c71a30570d8452ab6f25041402acd93dd598822603af', 'Upload content checksum mismatch; abort without overwriting site'
          source = brotli.decompress(base64.b64decode(payload)).decode('utf-8')
          assert hashlib.sha256(source.encode()).hexdigest() == '95e3050de1edfbddca8ca3b43da19b57bb0d4fc9bfef354365a3503bcd57f9d0', 'Decompressed bundle mismatch'
          approved = {'index.html','styles.css','app.js','netlify.toml','README.md','UPGRADE-NOTES.md','assets/skyline.svg','assets/favicon.svg'}
          items = [p.split(chr(1),1) for p in source.split(chr(0))]
          assert {p for p,_ in items} == approved
          for name, contents in items:
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(contents)
              print('Updated', name)
          assert 'https://dfwdaily.midnightmeta.dev/' in Path('index.html').read_text()
          PY
          node --check app.js
      - name: Install licensed static map and font assets
        shell: bash
        run: |
          npm install --no-save --no-package-lock --ignore-scripts leaflet@1.9.4 @fontsource-variable/big-shoulders-display@5.3.0 @fontsource-variable/hanken-grotesk@5.3.0
          mkdir -p fonts vendor/leaflet/images
          cp node_modules/@fontsource-variable/big-shoulders-display/files/big-shoulders-display-latin-wght-normal.woff2 fonts/
          cp node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2 fonts/
          cp node_modules/leaflet/dist/leaflet.js vendor/leaflet/
          cp node_modules/leaflet/dist/leaflet.css vendor/leaflet/
          cp node_modules/leaflet/dist/images/layers.png vendor/leaflet/images/
          cp node_modules/leaflet/dist/images/layers-2x.png vendor/leaflet/images/
          cp node_modules/leaflet/LICENSE vendor/leaflet/LICENSE
          test -s fonts/hanken-grotesk-latin-wght-normal.woff2
          test -s fonts/big-shoulders-display-latin-wght-normal.woff2
          test -s vendor/leaflet/leaflet.js
      - name: Commit v2 UI and assets without touching published data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app.js netlify.toml README.md UPGRADE-NOTES.md assets/ vendor/ fonts/
          if git diff --cached --quiet; then
            echo 'v2 files already installed'
          else
            git commit -m 'Deploy DFW After Dark v2 site, styles and bundled assets'
            git push origin HEAD:main
          fi
